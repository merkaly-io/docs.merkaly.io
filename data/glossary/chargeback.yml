details: 'Mientras dura, el pago entero queda fuera del saldo retirable. Los contracargos golpean primero la cuenta de Merkaly; el proveedor revierte el reparto de la tienda mientras tenga el dinero (qué pasa si no lo tiene está por confirmar).'
