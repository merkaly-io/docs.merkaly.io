title: Conectar la cuenta de AliExpress
domain: proveedores
summary: El equipo de Merkaly conecta desde el dashboard la cuenta de AliExpress que creó para la organización. Sin esa conexión, ninguna llamada al proveedor funciona; el comerciante no puede conectarla ni desconectarla.
order: 1
map: catalog
steps:
  - from: staff
    to: dashboard
    kind: http
    label: Conectar
    title: Se pide la conexión
    description: 'Clientes > la organización > Proveedores, en el dashboard. Solo el equipo de Merkaly; el admin de la tienda solo ve si la cuenta está lista.'
  - from: dashboard
    to: aliexpress
    kind: http
    label: oauth/authorize
    title: AliExpress pide permiso
    description: 'Se entra con la cuenta de la organización y se autoriza a Merkaly; vuelve al dashboard con un código. Antes, la cuenta tiene que haber aceptado los términos del Dropshipping Center. Si el navegador muestra un error propio (no de AliExpress), son cookies viejas de aliexpress.com: incógnito o borrarlas.'
  - from: dashboard
    to: api
    kind: http
    label: POST /dashboard/clients/:client/providers/aliexpress/connection { code }
    title: El dashboard manda el código
    description: El api lo hace en la base de esa organización.
  - from: api
    to: aliexpress
    kind: http
    label: token/create
    title: El api cambia el código por tokens
  - node: api
    kind: command
    label: guarda la conexión
    title: Guarda la conexión
    description: Tokens (nunca salen en una respuesta), vencimiento y el id de vendedor de la cuenta.
    term: supplier-connection
  - from: api
    to: auth0
    kind: http
    label: aliexpressSellerId
    title: Asocia el vendedor a la tienda
    description: Así los avisos de AliExpress, que solo traen el vendedor, encuentran la tienda. Si falla, solo se registra en el log.
  - node: api
    kind: reply
    label: READY
    title: Lista para importar y pedir
    description: El token se renueva solo cuando le quedan menos de 5 minutos. Si vence y no se puede renovar, EXPIRED y hay que reconectar.
    term: supplier-connection
