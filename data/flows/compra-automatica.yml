title: Compra automática al proveedor
domain: pedidos
summary: Con el pago online confirmado, el api compra al proveedor solo, en dos pasos en cola (armar las compras y pedir cada una). El pedido queda creado sin pagar; el comerciante lo paga en su cuenta del proveedor.
order: 2
map: orders
steps:
  - node: api
    kind: event
    label: order.sale.paid
    title: El pago confirmado avisa a la cola
    description: Con el pago guardado, el api publica order.sale.paid en su exchange. Solo el pago online lo publica, nunca una venta importada. Si la publicación falla, queda en el log y nunca hace fallar el pago.
    term: order-sale-paid
  - node: api
    kind: command
    label: merkaly.api-procurement
    title: La cola arranca la compra automática
    description: Un intento por mensaje, como sistema, nunca a nombre del comprador. Si la venta ya tiene compras (repetido o comprado a mano), no hace nada.
    term: procurement
  - node: api
    kind: command
    label: una compra por cuenta
    title: Arma las compras
    description: Agrupa los ítems por cuenta del proveedor (una compra por cuenta) y recotiza el costo real. La compra nace TO_PLACE.
    term: purchase
  - node: api
    kind: error
    label: .retry → .dlq
    title: ¿Y si AliExpress limita al cotizar?
    description: Un límite de AliExpress o una falla pasajera (proveedor caído, red) vuelve a la cola cada 30 segundos, hasta 5 veces, y empieza de cero. Después el mensaje termina en la .dlq. Un rechazo definitivo (sin cuenta conectada, cotización que no cierra) no se reintenta.
    term: retry-queue
  - node: api
    kind: command
    label: order.purchase.place
    title: Un pedido en la cola por cada compra
    description: Con las compras ya guardadas, el api manda un mensaje por compra a la misma cola. Cada compra se pide y se reintenta sola; si el mensaje se pierde, la compra queda TO_PLACE para pedirla a mano.
    term: order-purchase-place
  - from: api
    to: aliexpress
    kind: http
    label: ds.order.create
    title: Pide al proveedor
    description: Un solo pedido con todas las líneas de la compra, sin pagar. Una compra ya pedida o cancelada se salta, y AliExpress reconoce el mismo id externo, así que repetir nunca duplica el pedido.
  - node: api
    kind: error
    label: .retry → .dlq
    title: ¿Y si falla al pedir?
    description: Una falla pasajera (límite de AliExpress, proveedor caído, red) queda anotada en la compra y vuelve a la cola cada 30 segundos, hasta 5 veces; después, a la .dlq.
    term: retry-queue
  - node: api
    kind: error
    label: SUPPLIER_ORDER_FAILED
    title: ¿Y si AliExpress rechaza la cuenta o al comprador?
    description: Cuenta de AliExpress incompleta o bloqueada, sesión vencida, CPF que no coincide con el nombre o dirección inválida no se arreglan reintentando. El error queda en la compra, el admin lo marca y el comerciante lo corrige y pide de nuevo con el botón.
    term: sale-attention
  - from: aliexpress
    to: api
    kind: reply
    label: un pedido por ítem
    title: AliExpress responde
    description: Cada ítem vuelve como su propio pedido, con su estado y sus cargos.
    term: supplier-order
  - node: api
    kind: event
    label: TO_PAY
    title: La venta queda por pagar al proveedor
    description: La compra queda AWAITING_PAYMENT.
    term: sale-status-to-pay
  - from: merchant
    to: aliexpress
    kind: http
    label: paga en su cuenta
    title: El comerciante paga el pedido
    description: Fuera de Merkaly, en su propia cuenta del proveedor.
  - from: aliexpress
    to: webhooks
    kind: http
    label: aviso de pedido
    title: AliExpress avisa el cambio
  - from: webhooks
    to: api
    kind: event
    label: supplier.order.status_changed
    title: El aviso llega al api
    term: supplier-order-status-changed
  - from: api
    to: aliexpress
    kind: http
    label: ds.order.get
    title: El api relee el pedido
    description: El mismo camino que el botón Sincronizar del admin. Guarda los cargos reales, que reemplazan a la estimación.
  - node: api
    kind: event
    label: ORDERED
    title: La venta queda pedida
    description: Pagada en el proveedor, esperando el despacho.
    term: sale-status-ordered
  - node: api
    kind: error
    label: AUTO_PROCUREMENT_FAILED
    title: ¿Y si se frenó?
    description: Si a los 30 minutos una venta pagada sigue sin compra (rechazo definitivo, mensaje en la .dlq o publicación perdida), el admin lo marca para comprar a mano. La compra y el pedido manuales quedan siempre como respaldo.
    term: sale-attention
