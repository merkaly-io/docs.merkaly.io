name: cuenta de pago
type: entity
domain: pagos
summary: 'La subcuenta de la tienda en un gateway. Una por gateway en cada organización (hoy solo Asaas), creada desde el admin; solo sirve para recibir.'
owner: api
relations: [gateway, payment-account-readiness, merkaly-main-account, split, withdrawal, personal-identity]
details: 'Se guarda aparte de la configuración (payment.accounts, una por gateway) porque tiene las credenciales, y nunca se sirve tal cual. La tienda usa la cuenta del gateway principal de su configuración payment. Las credenciales llegan una sola vez, al crearla. El email de registro no cambia: si está mal, se cierra la cuenta y se crea de nuevo.'
source: api.merkaly.io src/domain/payment
