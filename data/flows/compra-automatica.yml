title: Compra automática al proveedor
domain: pedidos
summary: Con el pago online confirmado, el api compra al proveedor solo. El pedido queda creado sin pagar; el comerciante lo paga en su cuenta del proveedor.
order: 2
map: orders
steps:
  - node: api
    kind: event
    label: order.sale.paid
    title: El pago confirmado avisa a la cola
    description: Con el pago guardado, el api publica order.sale.paid en su exchange. Solo el pago online lo publica, nunca una venta importada. Si la publicación falla, queda en el log y nunca hace fallar el pago.
    term: order-sale-paid
  - node: api
    kind: command
    label: merkaly.api-procurement
    title: La cola arranca la compra automática
    description: Un intento por mensaje, como sistema, nunca a nombre del comprador. Si la venta ya tiene compras (repetido o comprado a mano), no hace nada.
    term: procurement
  - node: api
    kind: command
    label: una compra por cuenta
    title: Arma las compras
    description: Agrupa los ítems por cuenta del proveedor (una compra por cuenta) y recotiza el costo real. La compra nace TO_PLACE.
    term: purchase
  - from: api
    to: aliexpress
    kind: http
    label: ds.order.create
    title: Pide al proveedor
    description: Un solo pedido con todas las líneas, sin pagar. Si falla, el error queda en la compra (SUPPLIER_ORDER_FAILED) y se reintenta a mano.
  - node: api
    kind: error
    label: .retry → .dlq
    title: ¿Y si AliExpress limita?
    description: Un límite de AliExpress o una falla pasajera (proveedor caído, red) vuelve a la cola cada 30 segundos, hasta 5 veces. Después el mensaje termina en la .dlq. Un rechazo definitivo (sin cuenta conectada, cotización que no cierra) no se reintenta.
    term: retry-queue
  - from: aliexpress
    to: api
    kind: reply
    label: un pedido por ítem
    title: AliExpress responde
    description: Cada ítem vuelve como su propio pedido, con su estado y sus cargos.
    term: supplier-order
  - node: api
    kind: event
    label: TO_PAY
    title: La venta queda por pagar al proveedor
    description: La compra queda AWAITING_PAYMENT.
    term: sale-status-to-pay
  - from: merchant
    to: aliexpress
    kind: http
    label: paga en su cuenta
    title: El comerciante paga el pedido
    description: Fuera de Merkaly, en su propia cuenta del proveedor.
  - from: aliexpress
    to: webhooks
    kind: http
    label: aviso de pedido
    title: AliExpress avisa el cambio
  - from: webhooks
    to: api
    kind: event
    label: supplier.order.status_changed
    title: El aviso llega al api
    term: supplier-order-status-changed
  - from: api
    to: aliexpress
    kind: http
    label: ds.order.get
    title: El api relee el pedido
    description: El mismo camino que el botón Sincronizar del admin. Guarda los cargos reales, que reemplazan a la estimación.
  - node: api
    kind: event
    label: ORDERED
    title: La venta queda pedida
    description: Pagada en el proveedor, esperando el despacho.
    term: sale-status-ordered
  - node: api
    kind: error
    label: AUTO_PROCUREMENT_FAILED
    title: ¿Y si se frenó?
    description: Si a los 30 minutos una venta pagada sigue sin compra (rechazo definitivo, mensaje en la .dlq o publicación perdida), el admin lo marca para pedir a mano. La compra manual queda siempre como respaldo.
    term: sale-attention
