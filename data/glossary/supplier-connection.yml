name: conexión con AliExpress
type: entity
domain: proveedores
summary: 'La cuenta de AliExpress del comerciante, autorizada a Merkaly. Toda llamada al proveedor la usa; no hay cuenta de Merkaly de respaldo.'
owner: api
relations: [aliexpress, supplier-vendor, market]
details: 'Guarda los tokens (nunca salen en una respuesta), su vencimiento y el id de vendedor, que también se guarda en la organización de Auth0 para que los avisos encuentren la tienda. Una cuenta de AliExpress conectada a dos tiendas resuelve solo a una.'
source: api.merkaly.io src/domain/integration/supplier
