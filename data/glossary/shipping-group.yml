name: grupo de flete
type: concept
domain: pedidos
summary: 'Un flete por grupo: las líneas Choice de AliExpress viajan juntas y el resto paga el flete de su tienda. Cada país de origen es su propio grupo.'
relations: [quoted-total, import-tax]
details: 'El grupo Choice sale gratis cuando su costo llega al umbral de envío gratis; un umbral de 0 (AliExpress Selection Standard) sale gratis siempre, y el impuesto de importación se estima sin flete. El flete cobrado de verdad se mide en cada pedido (flete base menos descuento). El flete de cada grupo se reparte entre sus líneas, así un ítem cancelado reembolsa su parte. El impuesto no sigue estos grupos: va por pedido de AliExpress (uno por tienda).'
