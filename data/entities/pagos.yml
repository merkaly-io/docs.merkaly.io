entities:
  - id: organization
    label: Organización
    caption: la tienda que vende
    outside: true
    col: 0
    row: 0
    summary: El comerciante. Recibe el dinero de las ventas de su tienda en su propia cuenta de pago.
  - id: account
    label: Cuenta de pago
    caption: settings.payments
    col: 1
    row: 0
    term: payment-account
    summary: La subcuenta de la tienda en el proveedor de pagos. Una por organización; se crea desde el admin y solo sirve para recibir.
    fields:
      - name: holder
        note: titular, persona física o empresa
      - name: pixKey
        note: la llave Pix a la que van los retiros
      - name: gateway
        note: id de la subcuenta, wallet, credenciales y aprobación (KYC) en el proveedor
  - id: withdrawal
    label: Retiro
    caption: finance.withdrawals
    term: withdrawal
    col: 2
    row: 0
    summary: El comerciante pasa su saldo a su llave Pix, a mano desde el admin. Antes se cobran las deudas abiertas.
  - id: debt
    label: Deuda
    caption: finance.debts
    term: debt
    col: 3
    row: 0
    summary: Lo que la tienda le debe a Merkaly, por ejemplo la tarifa del proveedor de un reembolso. Se cobra en el próximo retiro.
  - id: sale
    label: Venta
    caption: pedidos
    outside: true
    col: 0
    row: 1
    summary: El pedido del comprador. Su estado manda; el estado del pago es consecuencia del estado de la venta.
  - id: payment
    label: Pago
    caption: finance.payments
    col: 1
    row: 1
    term: finance-payment
    summary: El registro del dinero de una venta. Guarda el cobro vigente, todos los intentos anteriores y cómo se reparte con la tienda.
    fields:
      - name: gateway
        note: el cobro vigente, con su único estado
      - name: attempts
        note: cada cobro online, del más viejo al más nuevo
      - name: split
        note: porcentaje para la tienda (100 %) y si el reparto falló
  - id: refund
    label: Reembolso
    caption: finance.refunds
    term: refund
    col: 2
    row: 1
    summary: Dinero que vuelve al comprador, parcial o total, cuando se cancela una venta pagada.
  - id: charge
    label: Cobro
    caption: en el proveedor, por payments
    col: 1
    row: 2
    term: payment-charge
    summary: Lo que el comprador paga (Pix hoy). Se crea en la cuenta de Merkaly con un reparto del 100 % a la tienda. Tiene un solo estado.
  - id: chargeback
    label: Contracargo
    caption: finance.chargebacks
    term: chargeback
    col: 2
    row: 2
    summary: El comprador disputa el pago ante su banco o el proveedor.
  - id: merkaly
    label: Cuenta de Merkaly
    caption: cuenta principal, CNPJ
    col: 3
    row: 1
    term: merkaly-main-account
    summary: Donde se crea cada cobro. Reparte el 100 % a la tienda y presta para los reembolsos.
relations:
  - { from: organization, to: account, label: tiene }
  - { from: sale, to: payment, label: se paga con }
  - { from: payment, to: charge, label: intenta, many: true }
  - { from: payment, to: refund, label: devuelve, many: true }
  - { from: payment, to: chargeback, label: recibe, many: true }
  - { from: payment, to: debt, label: genera, many: true }
  - { from: account, to: withdrawal, label: retira, many: true }
  - { from: withdrawal, to: debt, label: cobra, many: true }
  - { from: charge, to: merkaly, label: se crea en }
  - { from: merkaly, to: account, label: reparte 100 % a }
  - { from: merkaly, to: debt, label: presta y cobra }
