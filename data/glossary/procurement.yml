name: compra automática
type: concept
domain: pedidos
summary: 'Con el pago online confirmado, el api compra solo al proveedor, desde la cola merkaly.api-procurement. El pedido queda sin pagar; nunca se fuerza.'
relations: [purchase, sale-status-to-order, sale-attention, order-sale-paid, merkaly-api-procurement]
details: 'Corre como sistema, nunca a nombre del comprador, y nunca hace fallar el pago. Si AliExpress limita o hay una falla pasajera, la cola reintenta cada 30 segundos hasta 5 veces y después lo deja en la .dlq. Si se frena, a los 30 minutos el admin muestra AUTO_PROCUREMENT_FAILED y se compra a mano.'
